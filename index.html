<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO Title -->
    <title>
      RKG Digital | Digital Marketing Agency | SEO & Social Media Marketing
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="RKG Digital is a creative digital marketing agency helping businesses grow through SEO, social media marketing, content creation, branding, performance marketing and music promotion."
    />

    <!-- Keywords -->
    <meta
      name="keywords"
      content="RKG Digital, RKG Digital Studio, digital marketing agency, digital marketing company, SEO services, SEO agency, social media marketing, social media agency, branding agency, content creation, performance marketing, music promotion, online marketing, business growth"
    />

    <!-- Author -->
    <meta name="author" content="RKG Digital" />

    <!-- Search Engine Instructions -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#dc2626" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://rkgdigitalstudio.vercel.app/"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="RKG Digital | Digital Marketing Agency"
    />

    <meta
      property="og:description"
      content="Grow your brand with SEO, social media marketing, branding, content creation and performance marketing from RKG Digital."
    />

    <meta
      property="og:url"
      content="https://rkgdigitalstudio.vercel.app/"
    />

    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80"
    />

    <meta
      property="og:site_name"
      content="RKG Digital"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="RKG Digital | Digital Marketing Agency"
    />

    <meta
      name="twitter:description"
      content="SEO, social media marketing, branding, content creation and performance marketing for modern businesses."
    />

    <meta
      name="twitter:image"
      content="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&q=80"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
